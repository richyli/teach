  async function unlock(pw, quiet) {
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
        "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },

      el.innerHTML = new TextDecoder().decode(buf);
      el.hidden = false;
      el.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++)
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
      document.getElementById("gate").style.display = "none";
      sessionStorage.setItem(KEY, pw);
    } catch (e) {
      sessionStorage.removeItem(KEY);
      if (!quiet) {
        document.getElementById("err").textContent = "密碼不對";
        document.getElementById("pw").value = "";
        document.getElementById("pw").focus();

    }

  document.getElementById("pw").addEventListener("keydown", function (e) {

  });

  if (saved) unlock(saved, true);
