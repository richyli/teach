<body>
<div id="gate">
  <h2 style="font-size:1.05rem;color:#444;margin-bottom:1rem;">教師版 — 請輸入密碼</h2>
  <input id="pw" type="password" inputmode="numeric" autofocus autocomplete="off">
  <button id="go">進入</button>
  <p class="err" id="err"></p>
  <p class="hint">此頁內容加密儲存，密碼正確才會解開。<br>
  找課程內容請走 <a href="../../s/EMA/index.html">學生版</a>。</p>
</div>
<div id="content" class="container" hidden></div>
<script>
(function () {
  var SALT = "d5e+CvrcqQ+Nh2aZMt46oQ==", IV = "ly25vLQXQwRDOt2S", CT = "qNCiK5Hhs3w1c/k82xfCF/NRy4QlUzgCDJzGcCfN3rVwy3HonuxiQsKwnwFlIrZraNrzCYCITTfCV7WlpQNhmhp6ycKnFWAQvRlvbvw0AqafsyAMtdC05HtrIeGl7tQJmI8viotpqwQGZCDYMxH7xEsCT/Zr9THFZoSPG2+UC1wYyTpdiKpeayeaYofqrxx7C4IR3c8/l4T8w/Zekj7qrCUFGtNnabsbzNf4p/eG7IE7OHWjNrz+44pHt3S+mxKfC85aJmGcmltcduTI/s56s1tNMp5KNL0gMt6GlWtA5FvpqNex/TZxIOKU/U0Ps7xNgFwZISW9WoZk20M7ECB5EbJ5MvnegEbF6tDfjRAXzFy7Z5sNb2vHJRRdOXkD5vtvMTWobEBDp+teXBDPliU2EPIdF7CKp8v95go2L04rryE26hMHGTIwclTIhZhAZqWnVtwJKs0bTzPr9pJqq5FWp0KfKaE5Tfkr6UPEVfKjUG1x4iNUokYDU9rGlDUvCx/d1b13wwD8c8fuBuxmgR33e+drLgOw/NLmalznih1MOpGos+QZO78sf6GrNx5h6XSVT1pDRddSnOJdb/Py2x3zOqF9gMC0baYaDRnSW9eMtJC+BLkofcCNnaA06zxGHabkdYL8QaYrm5dLBZXzJHenP/VnMb5ouZoblrO5V65CIumgVHuEqvUeP7s06cJKM7W0NsMEs8YQBwnLhLRdTaMle6MjwuaeeDdklgGoitX1r3mWOXn4kxa2Gi1yzIr5jdsl/fCeIzd0UyMUbClRDjKCP7XxXxDFksMSPmATfjtMW3Tndu05CDXW4dk+/m9ncQWBkQOigFBK7N7s19rEZ4L6zz7gA/LmY7gqoCR9LDHq+nwNt7PKk9IXhRJw89anEPgeObHTCwernj3DHPC9mJGN", ITER = 250000, KEY = "teach_site_pw";
  function b64(s) { var r = atob(s), a = new Uint8Array(r.length);
    for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  async function unlock(pw, quiet) {
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
        "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
      var el = document.getElementById("content");
      el.innerHTML = new TextDecoder().decode(buf);
      el.hidden = false;
      el.querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script");
        for (var i = 0; i < old.attributes.length; i++)
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
      document.getElementById("gate").style.display = "none";
      sessionStorage.setItem(KEY, pw);
      if (location.hash.length > 1) {
        var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (t) { t.scrollIntoView(); t.classList.add("jump"); }
      }
    } catch (e) {
      sessionStorage.removeItem(KEY);
      if (!quiet) {
        document.getElementById("err").textContent = "密碼不對";
        document.getElementById("pw").value = "";
        document.getElementById("pw").focus();
      }
    }
  }
  document.getElementById("go").addEventListener("click", function () {
    unlock(document.getElementById("pw").value, false);
  });
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") unlock(this.value, false);
  });
  var saved = sessionStorage.getItem(KEY);
  if (saved) unlock(saved, true);
})();
</script>
