eZehr06Bq+nfO3PFlUvdmRhuMHEOF7IN5bZNimr3g90RG5EMRrbLIm2GtTyAUvMz", ITER = 250000, KEY = "teach_site_pw";

        for (var i = 0; i < old.attributes.length; i++)

        old.replaceWith(s);
