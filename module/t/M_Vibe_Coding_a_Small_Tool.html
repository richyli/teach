w7ubj7xQeo1+xlZ22+b4jipWKtvipJMXyhnWX0JeL9tN", ITER = 250000, KEY = "teach_site_pw";

      el.hidden = false;
      el.querySelectorAll("script").forEach(function (old) {

        for (var i = 0; i < old.attributes.length; i++)

        old.replaceWith(s);
