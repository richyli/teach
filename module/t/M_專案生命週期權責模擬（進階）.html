oMQN3iWS9Pvos6y5KyZz8WRGfzz9yw/fkhKrflBXJOzYxjh/wlcJsoY=", ITER = 250000, KEY = "teach_site_pw";

        for (var i = 0; i < old.attributes.length; i++)
